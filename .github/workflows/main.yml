name: Run Tender Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      
      # تشغيل السكربت أياً كان مكانه
      - name: Find and Run Scraper
        run: find . -name "scraper.js" -exec node {} \;
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      # التنبيه عبر تيليجرام
      - name: Send Telegram Notification
        if: always()
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="اختبار: الروبوت يعمل!")
          echo "Telegram API Response: $RESPONSE"
