name: Run Tender Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      
      - name: Locate and Execute
        run: |
          echo "--- مسار العمل الحالي هو: ---"
          pwd
          echo "--- محتويات المجلد الحالي: ---"
          ls -R
          echo "--- جاري البحث عن السكربت وتشغيله: ---"
          # هذا السطر يبحث عن الملف ويشغله فوراً بدون الحاجة لكتابة المسار يدوياً
          find . -name "scraper.js" -exec node {} \;
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      - name: Send Telegram Notification
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="تم تشغيل الروبوت، يرجى مراجعة الـ Logs في GitHub للتفاصيل."
