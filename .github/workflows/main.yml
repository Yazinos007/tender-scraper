name: Run Tender Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      
      # تشغيل مباشر للسكربت لرؤية الأخطاء فوراً في الـ Logs
      - name: Debug and Find File
        run: |
          echo "جاري البحث عن ملف scraper.js في كل مكان..."
          find . -name "scraper.js"
          
          # الآن سنشغل الملف الذي سيجده الـ find
          FILE_PATH=$(find . -name "scraper.js" | head -n 1)
          echo "تم العثور على الملف في: $FILE_PATH"
          node "$FILE_PATH"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          
      - name: Send Telegram Notification
        if: always()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.CHAT_ID }} \
          -d text="تم تشغيل الروبوت، يرجى مراجعة الـ Logs في GitHub للتفاصيل."
