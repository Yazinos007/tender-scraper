name: Run Tender Scraper
on:
  schedule:
    - cron: '0 8 * * *'
  defaults: 
      run:
        working-directory: ./  # لنبدأ من المجلد الرئيسي مباشرة

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./souqbtp-dashboard # هذا هو السطر السحري
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with: { node-version: '20' }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # ملاحظة: يجب أن نغير مسار تشغيل السكربت لأنه الآن أصبح داخل المجلد
      - run: node ../scraper.js 
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
